name: CI

# Repository CI is opt-in: run the local profiles in tools/ci/local-ci.sh and
# tools/ci/local-ci-windows.ps1 by default. This workflow never starts on push
# or pull_request; workflow_dispatch is reserved for an explicit operator request.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  policy-audit:
    name: Dependency + crypto policy audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # ADR-0002 / blueprint §11.5 criteria C2 and C4: no third-party runtime
      # dependency, and the null cipher cannot reach a shipped build.
      - name: audit
        run: sh tools/ci/audit-deps.sh

  lab-tool-tests:
    name: Lab analysis tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: test analyzer
        run: python3 -m unittest discover -s tools/lab -p 'test_*.py' -v
      - name: test SBOM generation logic
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: test netem rig safety
        run: sh -n tools/lab/netem-rig.sh && sh tools/lab/test_netem_rig.sh
      - name: test raw IP packet validator
        run: sh tools/ci/test-driver-packets.sh

  # GitHub-hosted Ubuntu is not a WSL VM. This runs the exact Ubuntu 24.04
  # shell entrypoint and userland used by developers running it inside WSL2.
  wsl-parity:
    name: WSL Ubuntu 24.04 parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run the WSL-compatible quick validation profile
        run: bash tools/ci/local-ci.sh --quick
      - name: Upload WSL/Linux validation logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-wsl-linux-ci-logs
          path: target/local-ci/logs/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  core-tests-linux:
    name: Rust workspace tests (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cargo test --workspace --all-targets --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Show failing tests and last 500 lines, so service failures are visible too
            FAIL_SNIPPET="$( (grep -n -E "FAILED|failures:|panicked at" test.log; tail -n 500 test.log) | tail -n 600)"
            SUMMARY="$(printf '### cargo test failed (exit %s)\n```\n%s\n```\n' "$code" "$FAIL_SNIPPET")"
            CRID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Rust workspace tests (ubuntu)") | .id][0] // empty' || true)
            if [ -n "$CRID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CRID" -f "output[title]=cargo test failure log" -f "output[summary]=$SUMMARY" || true
            fi
            exit "$code"
          fi
      # Log downloads are not always reachable from a sandboxed reviewer, so the
      # counts are published to the check-run summary on success as well.
      - name: publish results
        if: success()
        # Windows runners default to pwsh; this step is bash.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULTS="$(sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E '^test result:|^     Running ' || true)"
          SUMMARY="$(printf '### cargo test results\n```\n%s\n```\n' "$RESULTS")"
          # jq picks the id itself: piping gh into head trips pipefail on the
          # Windows runner (SIGPIPE), which fails the step.
          CRID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Rust workspace tests (ubuntu)") | .id][0] // empty' || true)
          if [ -n "$CRID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CRID" -f "output[title]=cargo test results" -f "output[summary]=$SUMMARY" || true
          fi

      - run: cargo build --release --workspace
      - name: generate and validate SPDX 2.3 inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$RUNNER_TEMP/sbom-validation.log"
          if ! {
            python3 -m pip install --disable-pip-version-check --no-input spdx-tools==0.8.5 &&
            sh tools/ci/sbom.sh 0.1.0 &&
            python3 -m spdx_tools.spdx.clitools.pyspdxtools --infile sbom.spdx.json
          } >"$LOG" 2>&1; then
            cat "$LOG"
            SUMMARY="$(printf '### SPDX 2.3 generation/validation failed\n```\n%s\n```\n' "$(tail -n 200 "$LOG")")"
            CRID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Rust workspace tests (ubuntu)") | .id][0] // empty' || true)
            if [ -n "$CRID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CRID" -f "output[title]=SPDX 2.3 validation failed" -f "output[summary]=$SUMMARY" || true
            fi
            exit 1
          fi
          cat "$LOG"
      - name: generate and validate SPDX 3.0.1 inventory
        shell: bash
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check --no-input spdx3-validate==0.0.7
          python3 tools/ci/sbom_v3.py 0.1.0
          python3 tools/ci/validate_spdx3.py sbom.spdx3.json
      - name: publish validated SBOM sidecars
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-sbom-0.1.0
          path: |
            sbom.spdx.json
            sbom.spdx3.json
          if-no-files-found: error
          retention-days: 90

  msvc-native-checks:
    name: Native MSVC checks (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build native WinUI shell and retain result for reporting
        shell: pwsh
        run: |
          $logDirectory = Join-Path $env:GITHUB_WORKSPACE 'target/local-ci-windows/logs/winui'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          $buildLog = Join-Path $logDirectory 'winui-build.txt'
          & dotnet build windows/BalanciFy.App/BalanciFy.App.csproj --configuration Release --runtime win-x64 2>&1 |
            Tee-Object -FilePath $buildLog
          $buildExitCode = $LASTEXITCODE
          "BALANCIFY_WINUI_BUILD_EXIT_CODE=$buildExitCode" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          if ($buildExitCode -ne 0) {
            $tail = Get-Content -LiteralPath $buildLog -Tail 120 | Out-String -Width 4096
            @"
          ### WinUI build failed (exit code $buildExitCode)

          ````text
          $tail
          ````
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $annotation = $tail -replace '%', '%25' -replace '\r', '%0D' -replace '\n', '%0A' -replace ':', '%3A' -replace ',', '%2C'
            Write-Output "::error title=WinUI build diagnostics::$annotation"
          }
      - name: Run native Windows quick validation with the MSVC developer environment
        if: always()
        shell: pwsh
        run: |
          $logDirectory = Join-Path $env:GITHUB_WORKSPACE 'target/local-ci-windows/logs/quick-validation'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          $quickLog = Join-Path $logDirectory 'native-quick-validation.txt'
          $quickExitCode = 0
          try {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found: $vswhere" }
            $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $vsInstall) { throw 'Visual Studio 2022 MSVC x64 tools were not found on this runner.' }
            $devCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
            if (-not (Test-Path -LiteralPath $devCmd)) { throw "VsDevCmd.bat was not found: $devCmd" }
            $batch = Join-Path $env:RUNNER_TEMP 'run-native-msvc-ci.cmd'
            @"
          @echo off
          call "$devCmd" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\ci\local-ci-windows.ps1" -Quick
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $batch -Encoding ascii
            $nativeOutput = & $env:ComSpec /d /c "`"$batch`"" 2>&1
            $quickExitCode = $LASTEXITCODE
            $nativeOutput | Tee-Object -FilePath $quickLog
            if ($quickExitCode -ne 0) { throw "Native Windows quick validation exited with code $quickExitCode." }
          } catch {
            if ($quickExitCode -eq 0) { $quickExitCode = 1 }
            $failure = ($_ | Out-String -Width 4096).Trim()
            Add-Content -LiteralPath $quickLog -Value "`n--- PowerShell failure ---`n$failure" -Encoding utf8
            $tail = (Get-Content -LiteralPath $quickLog -Tail 160 | Out-String -Width 4096).Trim()
            @"
          ### Native Windows quick validation failed (exit code $quickExitCode)

          ````text
          $tail
          ````
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $annotation = $tail -replace '%', '%25' -replace '\r', '%0D' -replace '\n', '%0A' -replace ':', '%3A' -replace ',', '%2C'
            Write-Output "::error title=Native Windows quick validation diagnostics::$annotation"
            exit $quickExitCode
          }
      - name: Upload native Windows validation logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-msvc-windows-ci-logs
          path: target/local-ci-windows/logs/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce WinUI build result
        if: always()
        shell: pwsh
        run: |
          if ($env:BALANCIFY_WINUI_BUILD_EXIT_CODE -and $env:BALANCIFY_WINUI_BUILD_EXIT_CODE -ne '0') {
            exit [int]$env:BALANCIFY_WINUI_BUILD_EXIT_CODE
          }

  windows-powershell-ipc:
    name: Windows PowerShell and IPC hosted validation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      - name: Parse-check every repository PowerShell script
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $relativePaths = @(& git -C $root ls-files --cached --others --exclude-standard -- '*.ps1' '**/*.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'git ls-files could not enumerate repository PowerShell files.' }
          $files = @($relativePaths | Where-Object { $_ -and $_ -notmatch '(^|[\\/])(target|node_modules|\.venv)([\\/]|$)' } |
            ForEach-Object { Get-Item -LiteralPath (Join-Path $root $_) })
          if ($files.Count -eq 0) { throw 'No .ps1 files found under the repository root.' }
          $failures = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in @($parseErrors)) {
              $failures.Add("$($file.FullName):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)")
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell files."
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            throw "PowerShell parser found $($failures.Count) syntax error(s)."
          }

      - name: Run PSScriptAnalyzer
        id: pssa
        continue-on-error: true
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $report = Join-Path $env:RUNNER_TEMP 'psscriptanalyzer-findings.json'
          $summaryPath = $env:GITHUB_STEP_SUMMARY
          $findings = @()
          $analysisError = $null
          try {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -ErrorAction Stop
            $relativePaths = @(& git -C $root ls-files --cached --others --exclude-standard -- '*.ps1' '**/*.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'git ls-files could not enumerate repository PowerShell files.' }
            $files = @($relativePaths | Where-Object { $_ -and $_ -notmatch '(^|[\\/])(target|node_modules|\.venv)([\\/]|$)' } |
              ForEach-Object { Get-Item -LiteralPath (Join-Path $root $_) })
            if ($files.Count -eq 0) { throw 'No repository .ps1 files found for PSScriptAnalyzer.' }
            $settings = Join-Path $root 'PSScriptAnalyzerSettings.psd1'
            $findings = @(Invoke-ScriptAnalyzer -Path $files.FullName -Settings $settings -Severity Error,Warning -ErrorAction Stop)
          } catch {
            $analysisError = $_.Exception.Message
          }

          $reportObject = [pscustomobject]@{
            analyzer = 'PSScriptAnalyzer'
            version = '1.24.0'
            settings = 'PSScriptAnalyzerSettings.psd1'
            executionError = $analysisError
            findings = @($findings | ForEach-Object {
              [pscustomobject]@{
                rule = $_.RuleName; severity = $_.Severity; file = $_.ScriptPath
                line = $_.Line; column = $_.Column; message = $_.Message
              }
            })
          }
          $reportObject | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $report -Encoding utf8

          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add('### PSScriptAnalyzer')
          $summary.Add('')
          $summary.Add('Settings: `PSScriptAnalyzerSettings.psd1`; no rules are blanket-suppressed.')
          $summary.Add('')
          if ($null -ne $analysisError) {
            $summary.Add("Analyzer execution failed: $analysisError")
            Write-Host "PSScriptAnalyzer execution failed: $analysisError"
          } elseif ($findings.Count -eq 0) {
            $summary.Add('No Error/Warning findings.')
            Write-Host 'PSScriptAnalyzer found no Error/Warning findings.'
          } else {
            $summary.Add('| Severity | Rule | File | Line | Message |')
            $summary.Add('|---|---|---|---:|---|')
            foreach ($finding in $findings) {
              $relativeFile = [IO.Path]::GetRelativePath($root, [string]$finding.ScriptPath)
              $message = ([string]$finding.Message -replace '[|]', '\|' -replace '[\r\n]+', ' ')
              $summary.Add('| {0} | `{1}` | `{2}` | {3} | {4} |' -f $finding.Severity,$finding.RuleName,$relativeFile,$finding.Line,$message)
              $annotationLevel = if ($finding.Severity -eq 'Error') { 'error' } else { 'warning' }
              $annotationProperties = "file=$relativeFile,line=$($finding.Line),col=$($finding.Column),title=$($finding.RuleName)"
              $annotationProperties = $annotationProperties -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A' -replace ':', '%3A' -replace ',', '%2C'
              $annotationMessage = ([string]$finding.Message) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::$($annotationLevel) $($annotationProperties)::$($annotationMessage)"
            }
            $findings | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
            $errorFindings = @($findings | Where-Object Severity -eq 'Error')
            $summary.Add('')
            $summary.Add("Error findings: $($errorFindings.Count); warning findings: $(@($findings | Where-Object Severity -eq 'Warning').Count).")
            if ($errorFindings.Count -gt 0) {
              Write-Host "PSScriptAnalyzer found $($errorFindings.Count) error-level finding(s)."
            } else {
              Write-Warning "PSScriptAnalyzer reported $($findings.Count) warning-level finding(s); warnings are listed for triage."
            }
          }
          $summary | Add-Content -LiteralPath $summaryPath -Encoding utf8
          if ($null -ne $analysisError -or @($findings | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }

      - name: Build the debug service test host (no driver)
        shell: bash
        run: cargo build -p balancify-service --bin balancify-service

      - name: Run read-only named-pipe IPC cases (hosted runner only)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $output = Join-Path $env:RUNNER_TEMP 'balancify-ipc-hosted-evidence'
          $state = Join-Path $env:RUNNER_TEMP 'balancify-ipc-hosted-state'
          New-Item -ItemType Directory -Path $output,$state -Force | Out-Null
          $env:BALANCIFY_STATE_DIR = $state
          Remove-Item Env:BALANCIFY_IPC_TRANSPORT,Env:BALANCIFY_RELAY_PUBLIC_KEY,Env:BALANCIFY_SECONDARY_RELAY_PUBLIC_KEY -ErrorAction SilentlyContinue
          $exe = Join-Path $root 'target\debug\balancify-service.exe'
          $stdout = Join-Path $output 'service.stdout.log'
          $stderr = Join-Path $output 'service.stderr.log'
          $service = $null
          try {
            $service = Start-Process -FilePath $exe -ArgumentList @('--insecure-lab') -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $pipeReady = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($service.HasExited) {
                $diagnostic = Get-Content $stdout,$stderr -ErrorAction SilentlyContinue | Out-String
                throw "Debug service exited before IPC became ready (exit=$($service.ExitCode)): $diagnostic"
              }
              try {
                $probe = [System.IO.Pipes.NamedPipeClientStream]::new('.', 'BalanciFy.Service.v1',
                  [System.IO.Pipes.PipeDirection]::InOut, [System.IO.Pipes.PipeOptions]::None,
                  [System.Security.Principal.TokenImpersonationLevel]::Impersonation)
                $probe.Connect(250)
                $pipeReady = $true
                $probe.Dispose()
                break
              } catch {
                if ($null -ne $probe) { $probe.Dispose() }
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $pipeReady) { throw 'Named-pipe listener did not become ready within 30 seconds.' }
            $ipcScript = Join-Path $root 'scripts/windows/Test-IpcAcceptance.ps1'
            $scriptArgs = @('-NoProfile','-ExecutionPolicy','Bypass','-File',$ipcScript,
              '-Role','Auto','-ReadOnlyOnly','-OutputDirectory',$output)
            $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
            $taskScheduler = Get-Service -Name Schedule -ErrorAction SilentlyContinue
            if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -and
                $null -ne $taskScheduler -and $taskScheduler.Status -eq 'Running') {
              $scriptArgs += '-IncludeNonInteractiveProbe'
            } else {
              Write-Host 'Skipping session-0 probe: hosted token/task-scheduler prerequisites are not available.'
            }
            & powershell.exe @scriptArgs
            if ($LASTEXITCODE -ne 0) { throw "IPC acceptance script exited with code $LASTEXITCODE." }
          } finally {
            if ($null -ne $service -and -not $service.HasExited) { Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload PowerShell and IPC hosted evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-windows-powershell-ipc-hosted-evidence
          path: |
            ${{ runner.temp }}/psscriptanalyzer-findings.json
            ${{ runner.temp }}/balancify-ipc-hosted-evidence/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce PSScriptAnalyzer after IPC evidence collection
        if: always()
        shell: pwsh
        env:
          PSSCRIPTANALYZER_OUTCOME: ${{ steps.pssa.outcome }}
        run: |
          if ($env:PSSCRIPTANALYZER_OUTCOME -ne 'success') {
            throw "PSScriptAnalyzer did not pass (outcome=$env:PSSCRIPTANALYZER_OUTCOME); inspect the findings in the job summary/artifact."
          }

  core-tests-windows:
    name: Rust workspace tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cargo test --workspace --all-targets --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            FAIL_SNIPPET="$( (grep -n -E "FAILED|failures:|panicked at" test.log; tail -n 500 test.log) | tail -n 600)"
            SUMMARY="$(printf '### cargo test failed (exit %s)\n```\n%s\n```\n' "$code" "$FAIL_SNIPPET")"
            CRID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Rust workspace tests (windows)") | .id][0] // empty' || true)
            if [ -n "$CRID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CRID" -f "output[title]=cargo test failure log" -f "output[summary]=$SUMMARY" || true
            fi
            exit "$code"
          fi

      # Log downloads are not always reachable from a sandboxed reviewer, so the
      # counts are published to the check-run summary on success as well.
      - name: publish results
        if: success()
        # Windows runners default to pwsh; this step is bash.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULTS="$(sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E '^test result:|^     Running ' || true)"
          SUMMARY="$(printf '### cargo test results\n```\n%s\n```\n' "$RESULTS")"
          # jq picks the id itself: piping gh into head trips pipefail on the
          # Windows runner (SIGPIPE), which fails the step.
          CRID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Rust workspace tests (windows)") | .id][0] // empty' || true)
          if [ -n "$CRID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CRID" -f "output[title]=cargo test results" -f "output[summary]=$SUMMARY" || true
          fi

  driver-build-x64:
    name: WDK driver build (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          # WDK 10.0.26100's MSBuild tasks target VS 2022 (17.x).
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Install pinned Microsoft WDK
        uses: microsoft/windows-drivers-rs/.github/actions/install-wdk@c4ae6815484398dc9d28fbe97e6c02d44f9f49a8
        with:
          version: 10.0.26100.6584
          source: nuget
          host: amd64
          target: amd64
      - name: Build x64 release driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'wdk-build.log'
          $stdout = "$log.stdout"
          $stderr = "$log.stderr"
          $build = Start-Process -FilePath 'msbuild' -ArgumentList @('driver\balancify.vcxproj', '/m', '/nologo', '/v:minimal', '/p:Configuration=Release', '/p:Platform=x64', '/p:SignMode=Off') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $buildExitCode = $build.ExitCode
          Get-Content $stdout,$stderr -ErrorAction SilentlyContinue | Set-Content -Path $log -Encoding utf8
          $tail = if (Test-Path $log) { (Get-Content $log -Tail 160) -join "`n" } else { 'No MSBuild log was created.' }
          Write-Output $tail
          "### WDK x64 build (exit $buildExitCode)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $tail | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $checkId = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "WDK driver build (x64)" and .status == "in_progress") | .id][0] // empty'
          if ($checkId) {
            $title = if ($buildExitCode -eq 0) { 'WDK x64 build results' } else { 'WDK x64 build diagnostics' }
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/check-runs/$checkId" -f "output[title]=$title" -f "output[summary]=$tail" | Out-Null
          }
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - name: Verify x64 PE architecture, mitigations, and unsigned status
        shell: pwsh
        run: py -3 tools/ci/verify_driver_pe.py driver/x64/Release/balancify.sys x64
      - name: Upload unsigned x64 driver
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-driver-unsigned-x64
          path: driver/x64/Release/balancify.sys
          if-no-files-found: error
          retention-days: 7
      - name: Upload WDK build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-wdk-build-log
          path: ${{ runner.temp }}/wdk-build.log
          if-no-files-found: ignore
          retention-days: 7

  driver-build-arm64:
    name: WDK driver build (ARM64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Install pinned Microsoft WDK
        uses: microsoft/windows-drivers-rs/.github/actions/install-wdk@c4ae6815484398dc9d28fbe97e6c02d44f9f49a8
        with:
          version: 10.0.26100.6584
          source: nuget
          host: amd64
          target: arm64
      - name: Build ARM64 release driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'wdk-arm64-build.log'
          $stdout = "$log.stdout"
          $stderr = "$log.stderr"
          $build = Start-Process -FilePath 'msbuild' -ArgumentList @('driver\balancify.vcxproj', '/m', '/nologo', '/v:minimal', '/p:Configuration=Release', '/p:Platform=ARM64', '/p:SignMode=Off') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $buildExitCode = $build.ExitCode
          Get-Content $stdout,$stderr -ErrorAction SilentlyContinue | Set-Content -Path $log -Encoding utf8
          $tail = if (Test-Path $log) { (Get-Content $log -Tail 160) -join "`n" } else { 'No MSBuild log was created.' }
          Write-Output $tail
          "### WDK ARM64 build (exit $buildExitCode)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $tail | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $checkId = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "WDK driver build (ARM64)" and .status == "in_progress") | .id][0] // empty'
          if ($checkId) {
            $title = if ($buildExitCode -eq 0) { 'WDK ARM64 build results' } else { 'WDK ARM64 build diagnostics' }
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/check-runs/$checkId" -f "output[title]=$title" -f "output[summary]=$tail" | Out-Null
          }
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - name: Verify ARM64 PE architecture, mitigations, and unsigned status
        shell: pwsh
        run: py -3 tools/ci/verify_driver_pe.py driver/ARM64/Release/balancify.sys ARM64
      - name: Upload unsigned ARM64 driver
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-driver-unsigned-arm64
          path: driver/ARM64/Release/balancify.sys
          if-no-files-found: error
          retention-days: 7
      - name: Upload WDK ARM64 build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: balancify-wdk-arm64-build-log
          path: ${{ runner.temp }}/wdk-arm64-build.log
          if-no-files-found: ignore
          retention-days: 7


[package]
name = "balancify-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-binary cooperating endpoint (server mode, blueprint §4.7 T1/T3/T4): reassembles striped paths, forwards from one stable address"

[[bin]]
name = "balancify-relay"
path = "src/main.rs"

[dependencies]
balancify-tunnel = { path = "../tunnel" }
balancify-crypto = { path = "../crypto" }

[features]
default = []
# Lab only: compiles the null cipher so the rig can run before the Phase-4
# handshake/AEAD lands. A release build without it refuses to start.
lab-crypto = ["balancify-tunnel/lab-crypto"]

[dev-dependencies]
# Tests exercise the lane end to end, so they need the lab cipher — without
# leaking the feature into the shipped binary.
balancify-tunnel = { path = "../tunnel", features = ["lab-crypto"] }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 820" role="img" aria-labelledby="title desc">
<title id="title">Balancify roadmap sequence and estimated phase-duration ranges</title>
<desc id="desc">Blueprint estimates a 47 to 58 week program for a team of five to six engineers. Phase 2 exit gate G2 remains open. G3 needs a test-signed driver plus performance, HVCI and signing evidence; G4 needs Rig B and clean machine acceptance. Later gates depend sequentially on earlier gates.</desc>
<defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17243b}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#63718a}.phase{font-size:15px;font-weight:700}.dur{font-size:14px;font-weight:650;fill:#52637a}.grid{stroke:#e1e7f0;stroke-width:1}.bar{rx:7}.open{fill:#fff1d4;stroke:#d99017;stroke-width:2}.textsmall{font-size:12px}.gate{font-size:12px;font-weight:700}.range{fill:url(#range)}</style><pattern id="range" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dce7f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7193bd" stroke-width="3"/></pattern></defs>
<rect width="1980" height="820" rx="20" fill="#f4f7fb"/>
<text x="58" y="58" class="title">Roadmap · dependency-gated sequence</text>
<text x="58" y="86" class="sub">Blueprint rev 2 estimates · 5–6 engineer team assumption · duration ranges are planning inputs, not a current forecast</text>
<rect x="58" y="112" width="1604" height="76" rx="14" fill="#fff4dc" stroke="#e2b75e"/>
<text x="82" y="143" class="phase" fill="#8f5c00">CURRENT EXIT POSITION: G2 REMAINS OPEN</text>
<text x="82" y="168" class="sub">WDK x64/ARM64 CI builds pass; gate exit still requires a test-signed miniport runtime, HVCI evidence, and real Rig B results.</text>
<text x="290" y="228" class="textsmall" fill="#63718a">Cumulative weeks from program start (estimated sequence; each hatched section shows duration-range uncertainty)</text>
<!-- axis: x=290, 20 px/week, width=1160 for 58 weeks -->
<g transform="translate(290,250)">
 <g class="textsmall"><line x1="0" y1="0" x2="0" y2="450" class="grid"/><text x="0" y="-12" text-anchor="middle">0</text><line x1="200" y1="0" x2="200" y2="450" class="grid"/><text x="200" y="-12" text-anchor="middle">10</text><line x1="400" y1="0" x2="400" y2="450" class="grid"/><text x="400" y="-12" text-anchor="middle">20</text><line x1="600" y1="0" x2="600" y2="450" class="grid"/><text x="600" y="-12" text-anchor="middle">30</text><line x1="800" y1="0" x2="800" y2="450" class="grid"/><text x="800" y="-12" text-anchor="middle">40</text><line x1="1000" y1="0" x2="1000" y2="450" class="grid"/><text x="1000" y="-12" text-anchor="middle">50</text><line x1="1160" y1="0" x2="1160" y2="450" class="grid"/><text x="1160" y="-12" text-anchor="middle">58</text></g>
 <text x="-26" y="46" text-anchor="end" class="phase">P1 Feasibility</text><rect x="0" y="26" width="60" height="24" class="bar" fill="#3478b8"/><rect x="60" y="26" width="20" height="24" class="bar range"/><text x="1190" y="45" class="dur">3–4 weeks · G1 decisions / policy / signing strategy</text>
 <text x="-26" y="98" text-anchor="end" class="phase">P2 Lab prototype</text><rect x="60" y="78" width="120" height="24" class="bar" fill="#2667a6"/><rect x="180" y="78" width="60" height="24" class="bar range"/><text x="1190" y="97" class="dur">6–8 weeks · G2 steering + miniport tunnel</text><rect x="170" y="68" width="78" height="44" rx="10" class="open"/><text x="209" y="95" text-anchor="middle" class="gate" fill="#8f5c00">G2 OPEN</text>
 <text x="-26" y="150" text-anchor="end" class="phase">P3 Architecture</text><rect x="180" y="130" width="80" height="24" class="bar" fill="#267e7c"/><rect x="260" y="130" width="60" height="24" class="bar range"/><text x="1190" y="149" class="dur">4 weeks · G3 performance / HVCI / signing dry-run</text>
 <text x="-26" y="202" text-anchor="end" class="phase">P4 MVP</text><rect x="260" y="182" width="280" height="24" class="bar" fill="#4b9654"/><rect x="540" y="182" width="140" height="24" class="bar range"/><text x="1190" y="201" class="dur">14–18 weeks · G4 signed driver + Rig B + offline install</text>
 <text x="-26" y="254" text-anchor="end" class="phase">P5 Alpha</text><rect x="540" y="234" width="120" height="24" class="bar" fill="#d1842e"/><rect x="660" y="234" width="180" height="24" class="bar range"/><text x="1190" y="253" class="dur">6–8 weeks · G5 soak + Verifier</text>
 <text x="-26" y="306" text-anchor="end" class="phase">P6 Beta</text><rect x="660" y="286" width="160" height="24" class="bar" fill="#815ba7"/><rect x="820" y="286" width="180" height="24" class="bar range"/><text x="1190" y="305" class="dur">8 weeks · G6 compatibility + external review</text>
 <text x="-26" y="358" text-anchor="end" class="phase">P7 RC</text><rect x="820" y="338" width="80" height="24" class="bar" fill="#b55456"/><rect x="900" y="338" width="220" height="24" class="bar range"/><text x="1190" y="357" class="dur">4–6 weeks · G7 attestation / VEX / rollback</text>
 <text x="-26" y="410" text-anchor="end" class="phase">P8 Production</text><rect x="900" y="390" width="40" height="24" class="bar" fill="#334b70"/><rect x="940" y="390" width="220" height="24" class="bar range"/><text x="1190" y="409" class="dur">2 weeks · G8 GA / field readiness</text>
</g>
<rect x="58" y="735" width="26" height="18" rx="3" fill="#dce7f6" stroke="#7193bd"/><text x="94" y="749" class="textsmall">Planning-range extension</text>
<text x="376" y="749" class="phase">Total blueprint estimate: 47–58 weeks to GA</text>
<text x="58" y="782" class="sub">No approved baseline dates, staffing plan, sprint sizing, or actual phase start/end records are present. Re-baseline when owners, lab access, and signing lead times are confirmed.</text>
</svg>
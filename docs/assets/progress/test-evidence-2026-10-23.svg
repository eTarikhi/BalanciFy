</g>
<g transform="translate(60,716)"><rect width="1100" height="48" rx="12" fill="#fff7e4" stroke="#e5b54a"/><text x="20" y="30" class="label" fill="#7a5700">Evidence boundary: these are CI test counts. Driver/WDK runtime, Rig B measurements, clean-machine install, HVCI, and production UX are not validated by this chart.</text></g>
